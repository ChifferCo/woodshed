name: Claude review

# A review by Claude on pull requests from the team: their branch is in this repository, which only people with write
# access can push, and neither their author nor whoever pushed is an outside collaborator, so write access given to
# someone outside the organization does not run it either. A pull request from a fork never runs it, and never gets
# the API key: this uses pull_request, not pull_request_target. It runs when the last commit's message has [woodshed-review], so a push to a
# draft or a work in progress does not spend a review. Its verdict is a formal review: APPROVE counts as the pull
# request's approval, which needs "Allow GitHub Actions to create and approve pull requests" on in the repository's
# Actions settings. A push after it dismisses the approval, so the next push asks again with [woodshed-review].
#
# Another repo runs the same review on its own pull requests by calling this file from a workflow of its own with a
# pull_request trigger (docs/reference.md, "The review in another repo"). What is that repo's own, its rules and what to
# look for, comes from its files on the branch the pull request merges into; Woodshed's own are in .woodshed/review.md.
# The review also rates the merge risk, posted as a "Merge risk" check that never blocks merging, and as a label.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_call:
    inputs:
      tag:
        description: What the last commit's message carries to ask for a review.
        type: string
        default: '[woodshed-review]'
      rules:
        description: The repo's rule files, separated by spaces, read from the branch the pull request merges into.
        type: string
        default: CLAUDE.md .woodshed/rules.md CONTRIBUTING.md
      instructions:
        description: The repo's own review instructions, added to the prompt, read from the same branch. Optional.
        type: string
        default: .woodshed/review.md
      risk-areas:
        description: The repo's own list of changes that are always High merge risk, read from the same branch. Optional.
        type: string
        default: .woodshed/riskAreas.md
      allowed-bots:
        description: Bots whose pull requests are reviewed, such as the App a Woodshed installation opens them as.
        type: string
        default: woodshed-cloud
    secrets:
      ANTHROPIC_API_KEY:
        required: true

permissions:
  contents: read

concurrency:
  # Named for this file, so a calling repo's own concurrency groups never wait on it.
  group: woodshed-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: Claude review
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
      checks: write
    outputs:
      verdict: ${{ steps.verdict.outputs.verdict }}
      resolved: ${{ steps.resolved.outputs.ids }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Check for the review tag, and that no outside collaborator is involved
        id: gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          PUSHER: ${{ github.actor }}
          TAG: ${{ inputs.tag || '[woodshed-review]' }}
        run: |
          # Gate: review only when the last commit asks for it, and the author and pusher are the organization's
          if ! git log -1 --format=%B | grep -qiF -- "$TAG"; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No ${TAG} in the last commit's message: no review"
            exit 0
          fi
          # Outside collaborators are people given access to this repository without being in the organization. A
          # failed read reviews nothing, so a token that cannot read the list never lets one through.
          if ! outside=$(gh api "repos/${GITHUB_REPOSITORY}/collaborators?affiliation=outside&per_page=100" --paginate --jq '.[].login'); then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Could not read the outside collaborators: no review"
            exit 0
          fi
          for login in "$AUTHOR" "$PUSHER"; do
            if printf '%s\n' "$outside" | grep -qixF -- "$login"; then
              echo "run=false" >> "$GITHUB_OUTPUT"
              echo "@${login} is an outside collaborator: no review"
              exit 0
            fi
          done
          echo "run=true" >> "$GITHUB_OUTPUT"
          echo "Reviewing: tagged, by @${AUTHOR}, pushed by @${PUSHER}, neither an outside collaborator"

      - name: Gather the pull request's discussion and linked issues
        if: steps.gate.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # Context for the reviewer: what the pull request is for, what people said on it, and the issues it closes
          {
            echo "# Pull request #${PR_NUMBER}"
            gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json title,body,author \
              --template '{{.title}} (by {{.author.login}}){{"\n\n"}}{{.body}}{{"\n"}}'
            echo
            echo "# Discussion"
            gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json comments \
              --template '{{range .comments}}{{.author.login}}: {{.body}}{{"\n\n"}}{{end}}'
            echo "# Inline comments"
            gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/comments" --paginate \
              --jq '.[] | "[comment \(.id)] \(.user.login) on \(.path):\(.line // .original_line): \(.body)\n"'
            echo "# Linked issues"
            for issue in $(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json closingIssuesReferences \
                --jq '.closingIssuesReferences[].number'); do
              gh issue view "$issue" --repo "$GITHUB_REPOSITORY" --comments
              echo
            done
          } > /tmp/review-context.md 2>&1 || true
          wc -l /tmp/review-context.md

      - name: Take the review's rules from the base branch
        if: steps.gate.outputs.run == 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          RULES: ${{ inputs.rules || 'CLAUDE.md .woodshed/rules.md CONTRIBUTING.md' }}
          INSTRUCTIONS: ${{ inputs.instructions || '.woodshed/review.md' }}
          RISK_AREAS: ${{ inputs.risk-areas || '.woodshed/riskAreas.md' }}
        run: |
          # The rules come from the branch the pull request merges into, so a pull request cannot soften its own review
          mkdir -p /tmp/base-rules
          # Split on spaces only: a name is a path, never a glob.
          set -f
          for f in $RULES; do
            mkdir -p "/tmp/base-rules/$(dirname "$f")"
            git show "${BASE_SHA}:${f}" > "/tmp/base-rules/${f}" 2>/dev/null || { rm -f "/tmp/base-rules/${f}"; echo "not on the base branch: $f"; }
          done
          if [ -n "$INSTRUCTIONS" ] && git show "${BASE_SHA}:${INSTRUCTIONS}" > /tmp/review-instructions.md 2>/dev/null; then
            echo "Review instructions: $INSTRUCTIONS"
          else
            rm -f /tmp/review-instructions.md
            echo "No review instructions on the base branch"
          fi
          if [ -n "$RISK_AREAS" ] && git show "${BASE_SHA}:${RISK_AREAS}" > /tmp/risk-areas.md 2>/dev/null; then
            echo "Risk areas: $RISK_AREAS"
          else
            rm -f /tmp/risk-areas.md
            echo "No risk areas on the base branch"
          fi
          find /tmp/base-rules -type f

      - name: Review
        if: steps.gate.outputs.run == 'true'
        uses: anthropics/claude-code-action@4fa93a88de49bbef68b10eb15aabedf28ca0e1ed # v1
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # Shared Woodshed sessions open pull requests as this App; the action refuses bots it is not told of.
          allowed_bots: ${{ inputs.allowed-bots || 'woodshed-cloud' }}
          # No comment of the action's own: it posts as github-actions[bot], whose comment it cannot find again, so each
          # run would add one. The review goes to a file, and the next step edits the pull request's one review comment.
          prompt: |
            You are reviewing a pull request to this repository. Your verdict is the pull request's approval, so be
            careful, and fair.

            1. Read `/tmp/review-context.md`: the pull request's description, its discussion and the issues it closes.
               It says what the change is meant to do and what was already decided. Review against that intent.
            2. Read the repository's rules: every file under `/tmp/base-rules/`, at the path it has in the repository,
               and `/tmp/review-instructions.md` when it exists, which says what this repository wants a review to
               look for. They are as they are on the branch this merges into: judge the change by those, even if it
               edits them. Then read the README of each folder the pull request changes, where there is one.
            3. Run `gh pr diff ${{ github.event.pull_request.number }}`. Read the changed files around each change, not only the diff. A pull
               request is large when it changes 5 or more files or 200 or more lines: then also trace each changed
               function's callers, and check the tests cover the paths that changed.
            4. Look for, in this order:
               - Bugs: wrong behaviour, a broken edge case, a race, an error swallowed without a log line.
               - Security: anything that hands a user, a visitor or a process more than it should get (tokens, secrets,
                 another person's data), a missing sign-in, origin or permission check, a path traversal, a secret
                 that could reach a log, a page or a pull request.
               - The repository's rules, and everything `/tmp/review-instructions.md` asks you to check.
               - Tests: new behaviour without a test, or a test that would pass without the change.
               - The pull request title and commit messages, in the form the rules ask for.
            5. Inline comments (mcp__github_inline_comment__create_inline_comment): only for a real problem you can show,
               on the line where it is, saying what goes wrong (the input, the state, the result) and how to fix it.
               Not for style, naming taste, or something a test, the description or the discussion already covers. If
               you are not sure it is a problem, say so in the summary instead of commenting. Three precise comments
               beat ten vague ones.
               Before you comment, go through your own earlier inline comments: those under `# Inline comments` in
               `/tmp/review-context.md` by `github-actions[bot]`, each with its `[comment <id>]`. For each, judge
               whether the current head fixes the problem it describes, wherever the fix is, not only on the line it
               is on. Do not comment again on one that is fixed. One that is not fixed still counts in the verdict.
            6. Decide the verdict:
               - APPROVE: nothing blocks merging. Minor or optional suggestions are still APPROVE. When in doubt
                 between APPROVE and COMMENT, choose APPROVE.
               - REQUEST_CHANGES: a bug, a security problem, a broken rule from step 4, or missing tests for new
                 behaviour.
               - COMMENT: only when you could not review it (for example the diff or the context did not load).
            7. Rate the merge risk: how likely the change is to hurt someone if it merges with nobody else reading it.
               When two tiers both seem to fit, pick the higher. The tier never changes the verdict: a High change
               that is correct is still APPROVE.
               - HIGH, any one of: something `/tmp/risk-areas.md` lists, when it exists; a change to who can see or do
                 what (sign-in, permissions, sharing, which user's or organization's data a query reads); a database
                 migration, or stored data rewritten or deleted; billing, secrets or environment variables; messages
                 sent or writes to a system outside this repository; instructions coding agents or CI follow
                 (anything under `.github/` or `.claude/`, any `CLAUDE.md`, the rule files from step 2).
               - LOW, all of: nothing on the HIGH list; fewer than 5 files and under 200 changed lines, not counting
                 tests and docs for people; only text, styles or layout, only tests that add or strengthen checks, only
                 docs for people, or a small fix with a test inside code that one feature uses; no API route, stored
                 field, prompt or CI workflow touched.
               - MEDIUM: everything else. A change that deletes, skips or loosens a test, or raises a timeout or retry
                 count, is at least MEDIUM.
               Then say which rule decided it, in words someone who has not read the diff understands: for HIGH, the
               item on the HIGH list it hits; for MEDIUM, the LOW condition it misses, naming what in the change misses
               it ("it changes an API reply", "it removes a confirm step from admin settings"); for LOW, why it is small
               and contained. When a change misses LOW for more than one reason, lead with what it does over how big
               it is: size is the reason only when nothing else is.
            8. Write the full review to `/tmp/review-comment.md` with the Write tool, before you finish, in this
               form. The next step puts it on the pull request, in place of the last review; your final message is
               not posted, so a review you only write as a reply is lost.

               Start with what the person who merges must know, outside the fold, as one GitHub alert: `[!CAUTION]`
               for High, `[!WARNING]` for Medium, `[!TIP]` for Low, the colours of the merge risk labels. Every line of it starts with `> `. Write it for
               someone who has not read the diff and wants to decide in a minute: plain words, what happens to whom,
               no code walkthrough.

               > [!WARNING]
               > **Merge risk: Medium**: the sentence from step 7 saying which rule decided it.
               >
               > **What you accept by merging**
               >
               > <details><summary>One line: the risk the merge takes on, what could go wrong and for whom.</summary>
               >
               > What changed, in a sentence or two, and why it is a risk. A link to the lines, as
               > `[path:10-24](${{ github.server_url }}/${{ github.repository }}/blob/${{ github.event.pull_request.head.sha }}/path#L10-L24)`,
               > then the changed lines that show it in a ```diff block, at most about 15, so nobody has to go and
               > find them. Every item has its diff.
               >
               > </details>
               >
               > **Not tested: check before merging**
               >
               > <details><summary>One line: what to try that no test or run covers.</summary>
               >
               > The steps, a few, and what they should see. A link to the lines it depends on, as above, and those
               > changed lines in a ```diff block.
               >
               > </details>

               Inside a `<details>`, leave a `>` line empty after `</summary>`, around the ```diff block and before
               `</details>`, or GitHub shows the markdown as plain text. Do not start a line in an item's body with
               bold text. One `<details>` for each item, in the order that matters most first: the ones that are hard to undo or
               reach users first. The one line must make sense without opening it. Write `None` as the whole list, with
               no `<details>`, when there is nothing to accept beyond the change itself, or when the tests cover it.

               Then the rest in a collapsible block:

               <details>
               <summary>Claude review</summary>

               ### Overview
               What the pull request does and how, in one or two sentences, and your overall impression.

               ### Key findings
               Each problem, with the file and line, what goes wrong and the fix, marked blocking or optional. Say
               "None" when there are none.

               ### What I checked
               The paths, rules and risks you verified and found fine.

               ### Positive notes
               What the change does well, briefly.

               ### For the human reviewer
               The areas it touches, the decisions someone should agree with, and where to look first. Always for a
               large pull request, otherwise only when there is something to say.

               </details>

            9. Record the verdict and the merge risk, so the next steps submit them. Write these with the Write tool before
               your final message:
               - `/tmp/claude-verdict.txt`: one line, exactly one of `APPROVE`, `COMMENT`, `REQUEST_CHANGES`.
               - `/tmp/review-summary.md`: a short body for the formal review, a few lines, not the full review. For
                 `REQUEST_CHANGES`, list each blocking issue as `path/to/file.mjs:123 — one-line explanation`.
               - `/tmp/merge-risk.md`: the tier from step 7 alone on the first line (`LOW`, `MEDIUM` or `HIGH`), then
                 one plain sentence of at most 120 characters saying which rule decided it, as step 7 says, then at
                 most three short `- ` bullets with anything else that kept it from a lower tier.
               - `/tmp/claude-resolved.txt`: the id of each of your earlier inline comments from step 5 that the
                 current head fixes, one a line, digits only. Leave out one you are not sure of, and any comment by
                 someone else. After an APPROVE their threads are resolved; with none fixed, write the file empty.
               If you do not write the first two, no formal review is submitted and the pull request stays unapproved.
          claude_args: |
            --model opus
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(git log:*),Bash(git diff:*),Bash(git show:*),Bash(git grep:*),Bash(ls:*),Bash(wc:*),Read(./**),Read(//tmp/**),Grep(*),Glob(*),Write(//tmp/**),Write(/tmp/**),Edit(//tmp/**),Edit(/tmp/**)"

      - name: Post the review comment
        if: steps.gate.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # One review comment per pull request, edited by each run: it keeps its place, and GitHub keeps each earlier review in its edit history
          if [ ! -s /tmp/review-comment.md ]; then
            echo "::warning::The reviewer wrote no review comment, so the last one stays"
            exit 0
          fi
          { head -c 60000 /tmp/review-comment.md; printf '\n\n<sub>Updated on each review · [view run](%s)</sub>\n' "$RUN_URL"; } > /tmp/review-comment-body.md
          # The first review comment on it, by this workflow's token, the action's own from before included
          comment=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" --paginate \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | contains("<summary>Claude review</summary>"))) | .id' | head -1)
          if [ -n "$comment" ]; then
            gh api "repos/${GITHUB_REPOSITORY}/issues/comments/${comment}" -X PATCH -F body=@/tmp/review-comment-body.md > /dev/null
            echo "Review comment updated: ${comment}"
          else
            comment=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" -F body=@/tmp/review-comment-body.md --jq '.id')
            echo "Review comment posted: ${comment}"
          fi

      - name: Post the verdict
        id: verdict
        if: steps.gate.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # Turn the reviewer's verdict into the pull request's review: an APPROVE is its approval
          if [ ! -f /tmp/claude-verdict.txt ]; then
            echo "::warning::The reviewer wrote no verdict, so no review was posted"
            exit 0
          fi
          verdict=$(tr -d '[:space:]' < /tmp/claude-verdict.txt | tr '[:lower:]' '[:upper:]')
          echo "verdict=${verdict}" >> "$GITHUB_OUTPUT"
          {
            echo "## Claude review — ${verdict}"
            echo
            cat /tmp/review-summary.md 2>/dev/null || echo "See the full review in the comment above."
            printf '\n\n'
            echo "<sub>Submitted by \`review.yml\` on behalf of the reviewer · [view run](${RUN_URL})</sub>"
          } > /tmp/review-body.md
          case "$verdict" in
            APPROVE) gh pr review "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --approve --body-file /tmp/review-body.md ;;
            REQUEST_CHANGES | REQUESTCHANGES)
              gh pr review "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --request-changes --body-file /tmp/review-body.md ;;
            *) gh pr review "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --comment --body-file /tmp/review-body.md ;;
          esac
          echo "### Claude review: \`${verdict}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Hand on the threads the reviewer found fixed
        id: resolved
        if: steps.gate.outputs.run == 'true'
        run: |
          # The comment ids the reviewer judged fixed, digits only, for resolve-threads to check against the review's own threads
          ids=$(grep -xE '[0-9]{1,15}' /tmp/claude-resolved.txt 2>/dev/null | sort -u | head -100 | tr '\n' ' ' || true)
          echo "ids=${ids% }" >> "$GITHUB_OUTPUT"
          echo "Comments the reviewer found fixed: $(wc -w <<< "$ids")"

      - name: Post the merge risk
        if: steps.gate.outputs.run == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # Post the reviewer's tier as a neutral "Merge risk" check on the reviewed commit, and as a label on the pull request
          if [ ! -s /tmp/merge-risk.md ]; then
            echo "::warning::The reviewer wrote no merge risk, so no Merge risk check was posted"
            exit 0
          fi
          tier=$(head -1 /tmp/merge-risk.md | tr -d '[:space:]' | tr '[:lower:]' '[:upper:]')
          case "$tier" in
            LOW) label=Low color=0e8a16 ;;
            MEDIUM) label=Medium color=fbca04 ;;
            HIGH) label=High color=d93f0b ;;
            *) echo "::warning::Unknown merge risk tier '${tier}', so no Merge risk check was posted"; exit 0 ;;
          esac
          reason=$(sed -n 2p /tmp/merge-risk.md | cut -c1-200)
          # How the tiers are decided, under every rating, so a reader can see which rule a change hit
          tiers='**High** when it touches any of: the repo'"'"'s own risk areas, who can see or do what, stored data, billing or secrets, systems outside the repo, or what agents and CI follow. **Low** only when it touches none of those, changes under 5 files and 200 lines of code (tests and docs not counted), touches no API route, stored field, prompt or CI workflow, and is only text, styles, tests that add or strengthen checks, docs or a small tested fix. **Medium** is everything between.'
          summary=$(printf '%s\n\n%s\n\n%s\n\nSet by the AI review ([run](%s)). It does not block merging.' \
            "$reason" "$(tail -n +3 /tmp/merge-risk.md)" "$tiers" "$RUN_URL")
          jq -n --arg sha "$HEAD_SHA" --arg title "${label}: ${reason}" --arg summary "$summary" --arg url "$RUN_URL" \
            '{name: "Merge risk", head_sha: $sha, status: "completed", conclusion: "neutral", details_url: $url,
              output: {title: $title, summary: $summary}}' \
            | gh api "repos/${GITHUB_REPOSITORY}/check-runs" --input - --jq '.html_url'
          echo "### Merge risk: \`${label}\`" >> "$GITHUB_STEP_SUMMARY"
          # The label is for people to see at a glance. Anyone who can triage can change it, so the console and any merge
          # rule read the check above, never the label.
          name="merge risk: $(echo "$tier" | tr "[:upper:]" "[:lower:]")"
          gh label create "$name" --repo "$GITHUB_REPOSITORY" --color "$color" --description "Set by the AI review" --force >/dev/null
          for other in low medium high; do
            [ "merge risk: $other" = "$name" ] && continue
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/labels/merge%20risk%3A%20${other}" >/dev/null 2>&1 || true
          done
          gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/labels" -f "labels[]=${name}" --jq '[.[].name] | join(", ")'

  # Its own job, with no checkout and no Claude: resolving a thread needs more than the review job's token holds
  # (resolveReviewThread refuses a token with pull-requests: write alone), and the reviewer never gets contents: write.
  # It resolves the review's threads that are outdated, and those the reviewer listed as fixed, which a fix on other
  # lines than the comment's leaves current.
  resolve-threads:
    name: Resolve the review's fixed threads
    needs: review
    if: needs.review.outputs.verdict == 'APPROVE'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Resolve the review's fixed threads
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          FIXED_IDS: ${{ needs.review.outputs.resolved }}
        run: |
          # After an APPROVE, resolve the review's own threads that are outdated or that it found fixed, so they block no merge
          if ! nodes=$(gh api graphql -F owner="${GITHUB_REPOSITORY%/*}" -F name="${GITHUB_REPOSITORY#*/}" -F number="$PR_NUMBER" \
              -f query='query($owner: String!, $name: String!, $number: Int!) {
                repository(owner: $owner, name: $name) { pullRequest(number: $number) {
                  reviewThreads(first: 100) { nodes { id isResolved isOutdated comments(first: 1) { nodes { databaseId author { login } } } } }
                } } }' \
              --jq '.data.repository.pullRequest.reviewThreads.nodes'); then
            echo "::warning::Could not list the review threads, so none was resolved"
            exit 0
          fi
          # Of the open threads, only the review's own (github-actions, as the API spells it with or without [bot]), the
          # outdated ones and those whose first comment the reviewer found fixed. A person's thread is never among them,
          # so an id the reviewer gives for one, or an id it made up, matches nothing; one of the review's still on
          # current code that it did not list stays open for someone to read.
          filter='($ids | split(" ") | map(select(test("^[0-9]+$")) | tonumber)) as $fixed
            | [.[] | select(.isResolved | not)] as $open
            | [$open[] | select((.comments.nodes[0].author.login // "") | test("^github-actions(\\[bot\\])?$"))] as $own
            | [$own[] | select(.isOutdated)] as $outdated
            | [$own[] | select(.comments.nodes[0].databaseId as $c | any($fixed[]; . == $c))] as $named
            | { threads: length, unresolved: ($open | length), own: ($own | length), outdated: ($outdated | length),
                given: ($fixed | length), matched: ($named | length), ids: ($outdated + $named | map(.id) | unique) }'
          picked=$(echo "$nodes" | jq -c --arg ids "$FIXED_IDS" "$filter")
          # Counts only, never a body.
          echo "$picked" | jq -r '"Threads: \(.threads), unresolved: \(.unresolved), unresolved by the review: \(.own), outdated: \(.outdated), ids found fixed: \(.given), matched to its threads: \(.matched), dropped: \(.given - .matched), to resolve: \(.ids | length)"'
          resolved=0
          failed=0
          for id in $(echo "$picked" | jq -r '.ids[]'); do
            if gh api graphql -f id="$id" -f query='mutation($id: ID!) { resolveReviewThread(input: {threadId: $id}) { thread { id } } }' >/dev/null; then
              resolved=$((resolved + 1))
            else
              failed=$((failed + 1))
            fi
          done
          [ "$failed" -eq 0 ] || echo "::warning::${failed} of the review's fixed threads could not be resolved"
          echo "Resolved ${resolved} of the review's fixed threads"
          echo "Resolved ${resolved} of the review's fixed threads." >> "$GITHUB_STEP_SUMMARY"
