name: Claude review

# A review by Claude on pull requests from the team: those whose branch is in this repository, which only people with
# write access can push. A pull request from a fork never runs it, and never gets the API key: this uses
# pull_request, not pull_request_target. It runs when the last commit's message has [woodshed-review], so a push to a
# draft or a work in progress does not spend a review. Its verdict is a comment review: a person still approves.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: Claude review
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Check for the [woodshed-review] tag
        id: gate
        run: |
          # Gate: review only when the last commit asks for it
          if git log -1 --format=%B | grep -qiF '[woodshed-review]'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No [woodshed-review] in the last commit's message: no review"
          fi

      - name: Review
        if: steps.gate.outputs.run == 'true'
        uses: anthropics/claude-code-action@4fa93a88de49bbef68b10eb15aabedf28ca0e1ed # v1
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          use_sticky_comment: true
          prompt: |
            You are reviewing a pull request to Woodshed, an open-source, dependency-free Node ESM project with no build
            step. This repository is public.

            1. Read `CLAUDE.md`, `.woodshed/rules.md` and `CONTRIBUTING.md`, then the README of each folder the pull
               request changes (`docs/reference.md` says where each one is).
            2. Run `gh pr view $PR_NUMBER` and `gh pr diff $PR_NUMBER`. Read the changed files around each change, not
               only the diff.
            3. Look for, in this order:
               - Bugs: wrong behaviour, a broken edge case, a race, an error swallowed without a log line.
               - Security: anything that hands a session or a visitor more than it should get (tokens, secrets, another
                 person's or another project's data), a missing sign-in, origin or write-access check, a path
                 traversal, a secret that could reach a log, a page or a pull request.
               - The rules in `CLAUDE.md`: a variable a session reads that is missing from `PER_SESSION_ENV`; a change
                 to how a session starts with no proof from the real image; a visible change to the console that
                 skips `console/designSystem/`.
               - Tests: new behaviour without a test, or a test that would pass without the change.
               - This repository is public: flag anything about an installation in the diff, the description or the
                 commit messages (links to a private console, Slack, Notion or private repositories, log lines,
                 account ids, emails, screenshots with data).
               - The pull request title and commit messages: one line in Conventional Commits form, no trailers.
            4. Post an inline comment (mcp__github_inline_comment__create_inline_comment) on the line of each real
               problem, saying what goes wrong and how to fix it. Skip style preferences and anything a test or the
               author already covers.
            5. Write your verdict to `/tmp/claude-verdict.txt`: APPROVE when nothing blocks merging, REQUEST_CHANGES
               for a bug, a security problem or a broken rule, COMMENT when unsure. Write a summary of three to six
               sentences to `/tmp/review-summary.md`: what the pull request does, what you checked, and what, if
               anything, must change.
          claude_args: |
            --model opus
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(git log:*),Bash(git diff:*),Bash(git show:*),Read(*),Grep(*),Glob(*),Write(//tmp/**)"

      - name: Post the verdict
        if: steps.gate.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # Post the reviewer's verdict as a comment review; a person approves the pull request
          if [ ! -f /tmp/claude-verdict.txt ]; then
            echo "::warning::The reviewer wrote no verdict"
            exit 0
          fi
          verdict=$(tr -d '[:space:]' < /tmp/claude-verdict.txt | tr '[:lower:]' '[:upper:]')
          {
            echo "## Claude review: ${verdict}"
            echo
            cat /tmp/review-summary.md 2>/dev/null || true
            echo
            echo "<sub>[View the run](${RUN_URL})</sub>"
          } > /tmp/review-body.md
          gh pr review "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --comment --body-file /tmp/review-body.md
          echo "### Claude review: \`${verdict}\`" >> "$GITHUB_STEP_SUMMARY"
          if [ "$verdict" = REQUEST_CHANGES ]; then exit 1; fi
