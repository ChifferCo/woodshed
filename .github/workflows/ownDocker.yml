name: Own Docker

# A session's own Docker under Sysbox, for real: builds the session image from this commit the way install.sh does
# with no repository (on the published runtime), installs Sysbox as providers/local/README.md says, and starts a
# session through the docker launcher with providers/local/bin/ownDockerInImage.mjs, which checks Docker from inside it
# as node and from the machine. The unit tests use stand-ins for Docker and the daemon; this is what they cannot show.
# Runs when what it proves changes, and by hand.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - session/Dockerfile
      - session/ownDocker.sh
      - session/entrypoint.sh
      - providers/local/dockerLauncher.mjs
      - providers/local/bin/ownDocker*
      - .github/workflows/ownDocker.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: own-docker-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  own-docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SYSBOX_VERSION: 0.7.1
      SYSBOX_SHA256: 9d6d5484f980d0a17f86c492c1262015c2afb66280bdb97215b79fde6a0261c5
      IMAGE: woodshed-session:own-docker-check
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.16.0

      - name: Install Sysbox, as providers/local/README.md says
        run: |
          uname -r
          docker rm -f $(docker ps -aq) 2>/dev/null || true
          curl -fsSLO "https://github.com/nestybox/sysbox/releases/download/v${SYSBOX_VERSION}/sysbox-ce_${SYSBOX_VERSION}.linux_amd64.deb"
          echo "${SYSBOX_SHA256}  sysbox-ce_${SYSBOX_VERSION}.linux_amd64.deb" | sha256sum -c -
          sudo apt-get update -qq
          sudo apt-get install -y "./sysbox-ce_${SYSBOX_VERSION}.linux_amd64.deb"
          docker info --format '{{json .Runtimes}}' | tee /dev/stderr | grep -q sysbox-runc

      - name: Build the session image from this commit, as install.sh does with no repository
        run: |
          context=$RUNNER_TEMP/context
          mkdir -p "$context/woodshed" "$context/woodshed-deps"
          cp -R session shared "$context/woodshed/"
          : >"$context/woodshed-deps.installs"
          printf 'true\n' >"$context/woodshed-deps.editor"
          docker build -f "$context/woodshed/session/Dockerfile" \
            --build-arg RUNTIME=ghcr.io/chifferco/woodshed-session-runtime:latest \
            --build-arg REPO= --build-arg REPO_DIR=/work/.no-checkout -t "$IMAGE" "$context"

      - name: Start a session with its own Docker and check it
        run: node providers/local/bin/ownDockerInImage.mjs "$IMAGE"
