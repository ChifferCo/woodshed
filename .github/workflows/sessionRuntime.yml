name: Session runtime image

# Publishes session/Dockerfile's `runtime` stage, everything in the session image that is the same for every repository,
# as ghcr.io/chifferco/woodshed-session-runtime: `:latest` and `:<commit>`, for x86 and Arm. install.sh builds a
# repository's session image on it, so a machine builds only the checkout and its installs. Built again when the
# Dockerfile changes and every Monday, for the week's system packages (BASE_WEEK). Claude is not in it: it changes
# daily, and the installs built on the runtime would then run again daily too. `:latest` comes from main alone; a run
# by hand from another branch publishes only `:<commit>`.

on:
  push:
    branches: [main]
    paths:
      - session/Dockerfile
      - .github/workflows/sessionRuntime.yml
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: session-runtime
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/chifferco/woodshed-session-runtime

jobs:
  build:
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pick the build args
        id: args
        run: |
          # The ISO week decides when the system packages are built again
          echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"

      - name: Build and push the runtime by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: session/Dockerfile
          target: runtime
          platforms: linux/${{ matrix.arch }}
          build-args: |
            BASE_WEEK=${{ steps.args.outputs.week }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=runtime-${{ matrix.arch }}
          cache-to: type=gha,scope=runtime-${{ matrix.arch }},mode=max

      - name: Keep the digest for the manifest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          # One empty file per architecture, named for its digest
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/*
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-*
          path: /tmp/digests
          merge-multiple: true

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag both architectures as one image
        working-directory: /tmp/digests
        run: |
          # :<commit>, and :latest from main only, name the x86 and Arm builds together
          tags=(-t "$IMAGE:$GITHUB_SHA")
          if [ "$GITHUB_REF" = refs/heads/main ]; then tags+=(-t "$IMAGE:latest"); fi
          # shellcheck disable=SC2046 # one digest per file name
          docker buildx imagetools create "${tags[@]}" $(printf "$IMAGE@sha256:%s " *)
          docker buildx imagetools inspect "$IMAGE:$GITHUB_SHA"
