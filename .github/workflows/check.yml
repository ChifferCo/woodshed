name: Check

# Woodshed has no dependencies and no build step, so its whole check is its tests and a shellcheck of its scripts.
# The repository's ruleset requires the `test` job on main.

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: check-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.16.0

      - name: Run the tests
        run: |
          # Every test in the repository, the layout guard and the import rules included
          # shellcheck disable=SC2046 # one test file per word, and these paths have no spaces
          node --test --test-timeout=120000 $(git ls-files '*.test.mjs' '**/*.test.mjs')

      - name: Shellcheck the scripts
        run: |
          # Catches quoting and unset-variable mistakes in the installer, the session image's scripts and scripts/
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck --severity=error install.sh session/*.sh scripts/*.sh

  # Woodshed's own project file through the reusable check other repos call, at this commit's Woodshed.
  project-check:
    uses: ./.github/workflows/project-check.yml
    with:
      ref: ${{ github.event.pull_request.head.sha || github.sha }}
      repository: ${{ github.repository }}
