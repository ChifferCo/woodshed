<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src 'self'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Woodshed</title>
<style>
  /* The console's tokens (console/public/style.css), the few this page uses. */
  :root {
    color-scheme: light;
    --ink: #1b2232; --sub: #666666; --meta: #767676; --line: #e2e2e2; --ground: #ffffff; --stopped: #f6f5f2;
    --action: #b45a05; --action-ink: #ffffff; --bad: #b42318;
    --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --ink: #e8ecf5; --sub: #a3aabb; --meta: #8f97a8; --line: #2a3142; --ground: #12151c; --stopped: #10131a;
      --action: #f59433; --action-ink: #1b1204; --bad: #f97066;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--stopped); color: var(--ink);
    font: 15px/1.5 "Red Hat Display", system-ui, -apple-system, "Segoe UI", sans-serif;
    display: grid; place-items: center; padding: 16px;
  }
  main {
    width: min(460px, 100%); background: var(--ground); border: 1px solid var(--line); border-radius: 12px;
    padding: 32px;
  }
  img { width: 56px; height: 56px; border-radius: 12px; display: block; margin-bottom: 20px; }
  h1 { font: 700 24px/1.3 Merriweather, Georgia, serif; margin: 0 0 8px; }
  p { margin: 0 0 20px; color: var(--sub); }
  label { display: block; font-weight: 600; margin-bottom: 6px; }
  input {
    width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--ground);
    color: var(--ink); font: 14px var(--mono);
  }
  input:focus { outline: 2px solid var(--action); outline-offset: 1px; }
  .hint { font: 12px var(--mono); color: var(--meta); margin: 6px 0 20px; }
  button {
    width: 100%; padding: 10px 14px; border: 0; border-radius: 6px; background: var(--action); color: var(--action-ink);
    font: 600 15px "Red Hat Display", system-ui, sans-serif; cursor: pointer;
  }
  button:disabled { opacity: 0.7; cursor: progress; }
  .error { color: var(--bad); margin: 16px 0 0; min-height: 1.5em; }
</style>
</head>
<body>
<main>
  <img src="icon.png" alt="">
  <h1>Open your Woodshed console</h1>
  <p>Type the address you open in your browser. Sign in there as you always do: the app keeps the address, and nothing else.</p>
  <form id="form">
    <label for="url">Console address</label>
    <input id="url" name="url" type="text" autocomplete="url" spellcheck="false" placeholder="https://woodshed.example.com" autofocus>
    <div class="hint">On this computer: localhost:7690</div>
    <button id="go" type="submit">Open the console</button>
    <div class="error" id="error" role="alert"></div>
  </form>
</main>
<script src="setup.js"></script>
</body>
</html>
