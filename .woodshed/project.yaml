# What a Woodshed session needs to know about Woodshed itself, for when woodshed/ is a repo of its own: nothing reads it
# while Woodshed is inside another repo, whose own .woodshed/project.yaml sessions read. test/selfProject.test.mjs
# keeps it valid. docs/reference.md, "The project file", describes each field. Left out: no dependencies, env files or
# databases.

version: 1

# The dev console with its made-up sessions (console/bin/devConsole.mjs): no Docker, AWS or GitHub. One server, so
# both ports are its own. A nested console that launches real sessions could come later.
app:
  start: bash scripts/devConsoleApp.sh start
  stop: bash scripts/devConsoleApp.sh stop
  frontendPort: 7690
  backendPort: 7690
  logs:
    console: ~/.cache/woodshed-dev-console/console.log
  paths: [console/public/]
  howToProve: >-
    Start the app (`bash scripts/devConsoleApp.sh start`), open http://localhost:7690/s/aaaa1111 in the Playwright
    browser and check the page you changed there, with a screenshot from its made-up sessions.

# VS Code in the browser on each session's checkout (Editor ↗).
editor: true

# This repo is public: what is posted here names no installation's console address.
consoleLinks: false

rules: .woodshed/rules.md

# What a pull request a session opens must pass before the console posts it to Slack: the review session's APPROVE,
# the Check suite's `test` job, and the review's Merge risk check, which the brief quotes.
pullRequests:
  # This repo is connected to Woodshed Internal and to two Woodshed Cloud orgs, which all act as one App: only the
  # woodrow org starts sessions from a label or comment and runs review and QA, so a ticket gets one session and one set
  # of comments. Sessions started by hand still run on any console.
  runsOn: woodshed-cloud[bot]/woodrow
  review:
    # The review runs as a Woodshed session on each new commit of a ready pull request, with no tag. The verdict is the
    # reviewer App's, since GitHub never lets the console App approve a pull request it opened. The PR comment with its
    # risk areas is the console App's.
    runner: woodshed
    heading: '## Claude review'
  suites:
    - name: Check
      workflow: .github/workflows/check.yml
      jobs: test
  mergeRisk:
    check: Merge risk
  # QA in a Woodshed session: the console adds the `woodshed-qa` label to each new pull request, and once the review
  # approves, a QA session tests it against the dev console app above and reports in the console's `QA` check, quoted
  # by the decision brief. Removing the label skips QA. No `author`: the report is that check, and sessions comment as
  # the App, whose login must never be trusted as a QA comment author.
  qa:
    runner: woodshed
    autoLabel: true
    label: woodshed-qa
    check: QA
    heading: '## QA'
    # This repo is public: anyone reading a QA comment may watch its recording, though nothing else on the console.
    recordings: public
