# What a Woodshed session needs to know about Woodshed itself, for when woodshed/ is a repo of its own: nothing reads it
# while Woodshed is inside another repo, whose own .woodshed/project.yaml sessions read. test/selfProject.test.mjs
# keeps it valid. docs/reference.md, "The project file", describes each field. Left out: no dependencies, env files or
# databases.

version: 1

# The dev console with its made-up sessions (console/bin/devConsole.mjs): no Docker, AWS or GitHub. One server, so
# both ports are its own. A nested console that launches real sessions could come later.
app:
  start: bash scripts/devConsoleApp.sh start
  stop: bash scripts/devConsoleApp.sh stop
  frontendPort: 7690
  backendPort: 7690
  logs:
    console: ~/.cache/woodshed-dev-console/console.log
  paths: [console/public/]
  howToProve: >-
    Start the app (`bash scripts/devConsoleApp.sh start`), open http://localhost:7690/s/aaaa1111 in the Playwright
    browser and check the page you changed there, with a screenshot from its made-up sessions.

# VS Code in the browser on each session's checkout (Editor ↗).
editor: true

# This repo is public: what is posted here names no installation's console address.
consoleLinks: false

rules: .woodshed/rules.md

# What a pull request a session opens must pass before the console posts it to Slack: the review's APPROVE in
# .github/workflows/review.yml, the Check suite's `test` job, and the review's Merge risk check, which the brief quotes.
pullRequests:
  review:
    # review.yml posts the verdict with the workflow's token, as a review whose body starts `## Claude review — APPROVE`.
    author: github-actions[bot]
    heading: '## Claude review'
    workflow: .github/workflows/review.yml
    rerun: '[woodshed-review]'
    # The review's PR comment comes from the same token: its risk areas, then the review under
    # <summary>Claude review</summary>, the heading's words.
    commentAuthor: github-actions[bot]
  suites:
    - name: Check
      workflow: .github/workflows/check.yml
      jobs: test
  mergeRisk:
    check: Merge risk
  # QA in a Woodshed session: the `woodshed-qa` label on a pull request starts a QA session on its branch, which tests it against
  # the dev console app above and reports in the console's `QA` check, quoted by the decision brief. No `author`: the
  # report is that check, and sessions comment as the App, whose login must never be trusted as a QA comment author.
  qa:
    runner: woodshed
    label: woodshed-qa
    check: QA
    heading: '## QA'
