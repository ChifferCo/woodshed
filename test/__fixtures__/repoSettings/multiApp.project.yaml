# A made-up project of several apps: a store and its admin on one api, two databases, and three env files (two with a
# secret, one without), whose overrides wire the session's databases, ports and services. The golden test
# (test/repoSettingsGolden.test.mjs) writes its env files and rules and compares them with what Woodshed wrote before
# env files had defaults.
version: 1

dependencies:
  installs:
    - dir: api
      files: [package.json, package-lock.json]
      command: npm ci
      output: [node_modules]
    - dir: store
      files: [package.json, pnpm-lock.yaml]
      command: pnpm install --frozen-lockfile
      output: [node_modules]

env:
  APP_ENV: local
  API_PORT: '8080'
  SQL_HOST: '{{PGHOST}}'

envFiles:
  - path: api/.env
    secret: api-env
    overrides:
      - SQL_URL={{PG_URL}}
      - SQL_HOST={{PGHOST}}
      - SQL_PASSWORD={{PGPASSWORD}}
      - DOCS_URL={{MONGODB_URI}}
      - CACHE_URL=redis://localhost:6379
      - PORT=8080
      - UPLOADS_ENDPOINT={{S3_ENDPOINT?}}
      - MAPS_API_KEY={{MAPS_API_KEY?}}
      - '# The session serves the app on its own host.'
      - SITE_URL={{SESSION_APP_URL}}
  - path: store/.env.local
    secret: store-env
    overrides:
      - PUBLIC_API_URL=http://localhost:8080
      - PUBLIC_FEATURE_PREVIEW=true
      - PORT=5173
  - path: jobs/.env
    overrides:
      - JOBS_DATABASE_URL={{PG_URL}}
      - JOBS_PER_WORKER=4

databases:
  - engine: postgres
    dir: api
    migrate: make db-migrate
    seed: make db-seed
    envFiles: [api-env]
    paths: [api/sql/]
    migrations: api/sql/migrations
    migrationsTable:
      table: meta.applied_migrations
      column: version
    user: shop
    name: shop
  - engine: mongo
    dir: jobs
    envFiles: [api-env]
    paths: [jobs/documents/]

apps:
  - name: store
    label: Storefront
    start: make dev
    stop: make stop
    frontendPort: 5173
    backendPort: 8080
    logs:
      api: ~/.cache/shop/{{CHECKOUT}}/api.log
      store: ~/.cache/shop/{{CHECKOUT}}/store.log
    paths: [store/]
    howToProve: Run `make dev` and check each change in the browser.
  - name: admin
    start: make dev-admin
    stop: make stop
    frontendPort: 5174
    backendPort: 8080
    logs:
      admin: ~/.cache/shop/{{CHECKOUT}}/admin.log
    paths: [admin/]
    howToProve: Run `make dev-admin` and check the admin pages in the browser.

editor: true
rules: .woodshed/rules.md
setup: .woodshed/setup.md
