# A made-up project whose api and worker read one env file's values: both name the secret app-env, so both are written
# its text and a person's own lines for it, each followed by its own overrides. The golden test
# (test/repoSettingsGolden.test.mjs) compares them with what Woodshed wrote before env files had keys. It still writes
# them as `lines`, the deprecated name of `overrides`, so the goldens prove the old name writes the same bytes.
version: 1

envFiles:
  - path: api/.env
    secret: app-env
    lines:
      - PORT=8080
      - SQL_URL={{PG_URL}}
  - path: worker/.env
    secret: app-env
    lines:
      - ROLE=worker
      - SQL_URL={{PG_URL}}
      - UPLOADS_ENDPOINT={{S3_ENDPOINT?}}
