# The same tmux setup as the Woodshed dev box (~/.tmux.conf there), for the session's terminal.
# --- General ---
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
# claude and codex run inline (session/bin/claude says why), so a pane's history is the conversation. Set here, before
# the first pane: tmux 3.3a applies a new history-limit only to panes made after it.
set -g history-limit 50000
# The browser's terminal (ttyd's xterm.js) keeps its own scrollback of what tmux scrolls off the top, so scrolling back
# over a pane on the main screen is the browser's alone (console/public/terminal.js). For that tmux must not put it on
# its alternate screen (smcup, rmcup), and must scroll it a line feed at a time: xterm.js drops the lines a multi-line
# scroll (indn) moves off the top. The status line is at the bottom for the same reason (below).
set -ga terminal-overrides ",xterm*:smcup@:rmcup@:indn@"
# Which screen the pane is on, in the terminal's title, where the browser reads it: a pane on the alternate screen (a
# full-screen program), in copy mode, or split, still scrolls through tmux. tmux sets the title only as it redraws the
# status line, which it does at least every status-interval.
set -g set-titles on
set -g set-titles-string "#{session_name} (#{?pane_in_mode,copy mode,#{?alternate_on,alternate screen,#{?#{==:#{window_panes},1},main screen,panes}}})"
set -g status-interval 1
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g escape-time 0
set -g focus-events on

# --- Prefix (default C-b) ---

# --- Splits ---
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# New window keeps current path
bind c new-window -c "#{pane_current_path}"

# --- Navigation (vi-style) ---
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# --- Copy mode (vi) ---
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
# No pbcopy in a container: tmux hands copies to the browser terminal's clipboard instead (OSC 52).
set -g set-clipboard on

# --- Reload config ---
bind r source-file ~/.tmux.conf \; display "Config reloaded"

# --- Status bar ---
# At the bottom: on top, tmux scrolls the pane inside a region below it, and xterm.js keeps no scrollback of a region
# that does not start at the first row.
set -g status-position bottom
set -g status-style "bg=default,fg=white"
set -g status-left "#[bold]#S "
set -g status-right "%H:%M"
set -g status-left-length 20
