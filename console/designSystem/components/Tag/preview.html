<!-- @dsCard group="Cards" height=130 subtitle="Ownership tags and PR chips" -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@600;700&family=JetBrains+Mono:wght@600&display=swap">
<style>
 body{margin:0;padding:24px;background:var(--ground);color:var(--ink);font-family:"Red Hat Display",system-ui,sans-serif}
 .row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
 .tag{font:700 10px "Red Hat Display",system-ui,sans-serif;letter-spacing:.06em;text-transform:uppercase;padding:2px 6px;border-radius:4px}
 .assigned{color:var(--slate);box-shadow:inset 0 0 0 1px var(--slate)}
 .private{background:var(--private);color:var(--private-ink)}
 .private::before{content:"";display:inline-block;width:6px;height:5px;background:currentColor;border-radius:1px;margin-right:4px;box-shadow:0 -3px 0 -1px currentColor}
 .none{background:var(--stopped);color:var(--sub)}
 .pr{font:600 11px "JetBrains Mono",ui-monospace,monospace;padding:2px 6px;border-radius:5px;border:1px solid var(--green);color:var(--green)}
 .pr.bad{border-color:var(--bad);color:var(--bad)}
</style>
<div class="row"><span class="tag assigned">Assigned</span><span class="tag private">Private</span><span class="tag none">Unassigned</span></div>
<div class="row"><span class="pr">PR #26544 ✓</span><span class="pr bad">PR #26530 ✗</span></div>
