<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@500;600&display=swap">
<style>
 body{margin:0;padding:24px;background:var(--ground);color:var(--ink);font-family:"Red Hat Display",system-ui,sans-serif}
 .row{display:flex;gap:6px;align-items:center;margin-bottom:12px}
 .b{font:600 12px "Red Hat Display",system-ui,sans-serif;min-height:26px;padding:0 9px;border-radius:var(--radius-sm);background:var(--ground);color:var(--ink);border:1px solid var(--line);display:inline-flex;align-items:center;gap:5px}
 .dot{width:7px;height:7px;border-radius:50%;background:var(--green)}
 .menu{width:280px;padding:6px;border:1px solid var(--line);border-radius:8px;background:var(--ground);box-shadow:0 8px 24px rgba(27,34,50,.18)}
 .item{display:flex;flex-direction:column;gap:2px;padding:8px 10px;border-radius:6px}
 .item b{font-size:13.5px;font-weight:600}
 .item span{font-size:12px;color:var(--sub)}
 .item:first-child{background:var(--stopped)}
</style>
<div class="row"><span class="b">Start app ▾</span></div>
<div class="row"><span class="b"><span class="dot"></span>App ↗</span><span class="b">Admin ▾</span><span class="b">■</span></div>
<div class="menu">
 <div class="item"><b>Web</b><span>Stops Admin first, then starts this one</span></div>
 <div class="item"><b>Admin</b><span>Running now: starts it again</span></div>
</div>
