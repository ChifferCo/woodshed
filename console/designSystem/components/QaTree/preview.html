<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
 body{margin:0;padding:24px;background:var(--ground);color:var(--ink);font-family:"Red Hat Display",system-ui,sans-serif}
 .tools{display:flex;justify-content:flex-end;gap:6px;max-width:620px;margin-bottom:8px}

 ul{list-style:none;margin:0;padding:0;max-width:620px}
 ul ul{margin:4px 0 2px 9px;padding-left:16px;border-left:2px solid var(--line-soft)}
 .q{display:flex;align-items:flex-start;gap:8px;width:100%;text-align:left;padding:7px 8px;border:0;border-radius:5px;background:none;font:600 14px/1.5 "Red Hat Display",system-ui,sans-serif;color:var(--ink)}
 ul ul .q{font-weight:500;font-size:13.5px}
 .chev{width:16px;flex:none;color:var(--meta);font-size:11px;line-height:21px}

 .txt{flex:1}
 .kids{flex:none;align-self:center;font:500 11px/1.6 "JetBrains Mono",ui-monospace,monospace;color:var(--meta);border:1px solid var(--line);border-radius:3px;padding:0 5px}
 .a{padding:2px 8px 8px 32px;font-size:14px;line-height:1.62}
 .a p{margin:0 0 8px}
 code{font:500 .85em "JetBrains Mono",ui-monospace,monospace;background:var(--line-soft);border-radius:4px;padding:1px 4px}
 .pending,.mine{flex:none;align-self:center;font-weight:400;font-size:12px;color:var(--meta)}
 .ask{display:flex;gap:6px;margin:8px 0 2px}
 .ask input{flex:1;min-width:0;padding:6px 8px;font:13px "Red Hat Display",system-ui,sans-serif;border:1px solid var(--line);border-radius:4px;background:var(--ground);color:var(--ink)}
 .ask button{font:500 13px "Red Hat Display",system-ui,sans-serif;padding:6px 12px;border:1px solid var(--line);border-radius:6px;background:transparent;color:var(--slate)}
