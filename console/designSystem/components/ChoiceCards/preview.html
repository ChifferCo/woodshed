<!-- @dsCard group="Settings" height=560 subtitle="Two exclusive choices side by side, Production in its own colours when picked; New session's four agents, compact" -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@300..900&family=Red+Hat+Mono:wght@300..700&display=swap">
<style>
 body{margin:0;padding:24px;background:var(--ground);color:var(--ink);font-family:"Red Hat Display",system-ui,sans-serif}
 fieldset{margin:0;padding:0;border:0;max-width:640px}
 legend{font-size:14px;font-weight:600;margin-bottom:8px;padding:0}
 .cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
 .card{display:grid;grid-template-columns:18px minmax(0,1fr);gap:4px 10px;padding:12px 14px;border:1px solid var(--line);border-radius:8px;background:var(--ground)}
 .radio{width:16px;height:16px;margin-top:1px;border-radius:50%;border:1.5px solid var(--meta);box-sizing:border-box}
 .title{font-weight:600;font-size:14px}
 .line{grid-column:2;font-size:12.5px;color:var(--sub)}
 .prod .title::before{content:"";display:inline-block;width:7px;height:6px;background:currentColor;border-radius:1px;margin-right:6px;vertical-align:1px;box-shadow:0 -3px 0 -1px currentColor}
 .prod.on{box-shadow:none;background:var(--prod);border-color:var(--prod);color:var(--prod-ink)}
 .prod.on .line{color:var(--prod-ink)}
 .prod.on .radio{border:5px solid var(--prod-ink)}
 .callout{margin-top:10px;max-width:640px;box-sizing:border-box;padding:10px 12px;border:1px solid var(--prod);border-left-width:4px;border-radius:6px;font-size:12.5px}
 .callout p{margin:0 0 6px;font-weight:600;font-size:13px;display:flex;gap:8px;align-items:center}
 .tag{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 6px;border-radius:4px;background:var(--prod);color:var(--prod-ink)}
 ul{margin:0;padding-left:18px}
 .on{border-color:var(--amber);box-shadow:inset 0 0 0 1px var(--amber)}
 .on .radio{border:5px solid var(--amber)}
 .agents{margin-top:24px;max-width:720px}
 .agents .cards{grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px}
 @media (max-width:560px){.agents .cards{grid-template-columns:repeat(2,minmax(0,1fr))}}
 .agents .card{padding:10px 12px;gap:2px 8px;align-content:start}
 .agents .line{font-size:12px}
 .off{background:var(--stopped);color:var(--sub)}
 .off .radio{border-color:var(--line)}
 .off a{color:inherit}
 .meta{grid-column:2;margin-top:2px;font:11.5px/1.35 "Red Hat Mono",ui-monospace,monospace;color:var(--meta)}
 .panel{margin-top:8px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;padding:12px;border:1px solid var(--amber);border-radius:8px;background:var(--amber-tint)}
 .panel p{grid-column:1/-1;margin:0;font-size:12.5px;font-weight:600}
 .panel label{display:grid;gap:3px;font-size:12px;font-weight:600;color:var(--amber-ink)}
 .panel span.box{font-weight:400;color:var(--ink);background:var(--ground);border:1px solid var(--line);border-radius:5px;padding:5px 8px}
 @media (max-width:560px){.panel{grid-template-columns:minmax(0,1fr)}}
</style>
<fieldset>
 <legend>Kind</legend>
 <div class="cards">
  <label class="card"><span class="radio"></span><span class="title">Ordinary</span><span class="line">Reads no production data. Sessions that use it keep their internet.</span></label>
  <label class="card prod on"><span class="radio"></span><span class="title">Production</span><span class="line">Reads production data. Its first call locks the session down for good.</span></label>
 </div>
</fieldset>
<div class="callout"><p><span class="tag">Production</span>What happens to a session that uses it</p>
 <ul><li>Its first call locks that session down for good: no internet but its org's private repos on GitHub, and no package installs.</li><li>The session is removed some time after it stops.</li></ul></div>
<fieldset class="agents">
 <legend>Agent</legend>
 <div class="cards">
  <label class="card on"><span class="radio"></span><span class="title">Claude</span><span class="line">Your Claude plan</span><span class="meta">opus (saved) · high · auto</span></label>
  <label class="card"><span class="radio"></span><span class="title">Codex</span><span class="line">Your sign-in or the team key</span><span class="meta">default · auto</span></label>
  <label class="card off"><span class="radio"></span><span class="title">Grok</span><span class="line"><a href="#">Sign in on My settings</a></span></label>
  <label class="card off"><span class="radio"></span><span class="title">OpenCode</span><span class="line"><a href="#">Sign in on My settings</a></span></label>
 </div>
 <div class="panel"><p>Claude’s settings</p><label>Model<span class="box">opus (your last pick)</span></label><label>Effort<span class="box">default (high, your last pick)</span></label><label>Permissions<span class="box">auto</span></label></div>
</fieldset>
