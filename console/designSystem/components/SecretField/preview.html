<!-- @dsCard group="Settings" height=230 subtitle="A field for a pasted secret, masked, with Show beside it" -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@300..900&family=Red+Hat+Mono:wght@300..700&display=swap">
<style>
 body{margin:0;padding:24px;background:var(--ground);color:var(--ink);font-family:"Red Hat Display",system-ui,sans-serif;font-size:13px}
 .form{max-width:560px;display:flex;flex-direction:column;gap:12px}
 label{display:flex;flex-direction:column;gap:4px;font-weight:600}
 .secret{display:flex;align-items:flex-start;gap:6px}
 input{flex:1 1 auto;min-width:0;padding:8px 10px;border:1px solid #b9b9b9;border-radius:4px;background:var(--ground);color:var(--ink);font:400 13px "Red Hat Mono",monospace}
 button{height:32px;padding:0 12px;border:1px solid var(--line);border-radius:4px;background:var(--ground);color:var(--ink);font:600 12.5px "Red Hat Display",sans-serif}
 .sub{margin:0;color:var(--sub)}
</style>
<div class="form">
 <label>API token
  <span class="secret"><input type="password" value="tok_made_up_value_0001" placeholder="tok_…" autocomplete="new-password" spellcheck="false"><button type="button" aria-pressed="false">Show</button></span>
 </label>
 <label>Signing secret, shown to check the paste
  <span class="secret"><input type="text" value="made-up-signing-secret" spellcheck="false"><button type="button" aria-pressed="true">Hide</button></span>
 </label>
 <p class="sub">The token is kept sealed and never shown again.</p>
</div>
