<style>
 body{margin:0;padding:24px;background:var(--ground);color:var(--ink);font-family:"Red Hat Display",system-ui,sans-serif}
 .wrap{width:460px}
 .label{font-size:13px;font-weight:600;margin-bottom:4px}.label span{font-weight:400;font-size:12px;color:var(--meta);margin-left:8px}

 .menu{margin-top:4px;padding:4px;border:1px solid var(--line);border-radius:8px;background:var(--ground);box-shadow:0 6px 20px rgba(27,34,50,.12)}
 .row{display:grid;grid-template-columns:max-content 1fr;gap:2px 10px;padding:6px 8px;border-radius:5px}

 .num{grid-row:span 2;color:var(--slate);font:600 12.5px "Red Hat Mono",monospace}
 .t{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
 .d{margin-left:6px;padding:0 4px;border:1px solid var(--line);border-radius:3px;color:var(--sub);font-size:10.5px;text-transform:uppercase}
 .m{color:var(--sub);font:11.5px "Red Hat Mono",monospace}
