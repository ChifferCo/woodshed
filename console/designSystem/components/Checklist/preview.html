<!-- @dsCard group="Cards" height=300 subtitle="Steps of a running job: done, now with a bar, next, failed" -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@400;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
 body{margin:0;padding:24px;background:var(--ground);color:var(--ink);font:15px/1.5 "Red Hat Display",system-ui,sans-serif}
 .head{display:flex;justify-content:space-between;align-items:baseline;max-width:520px}
 .clock{font:600 18px "JetBrains Mono",ui-monospace,monospace}
 .pill{font-size:11.5px;font-weight:600;padding:2px 9px;border-radius:999px}
 .work{background:var(--slate-tint);color:var(--slate)} .ok{background:var(--add-tint);color:var(--green)} .bad{background:var(--del-tint);color:var(--bad)}
 ol{list-style:none;margin:6px 0 12px;padding:0;max-width:520px}
 li{display:flex;flex-direction:column;justify-content:center;gap:6px;min-height:32px;border-top:1px solid var(--line-soft);font-size:14px}
 .r{display:flex;align-items:center;gap:10px}
 .m{width:16px;height:16px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;box-sizing:border-box;flex-shrink:0}
 .done .m{background:var(--green);color:var(--ground)} .now .m{border:2px solid var(--amber);border-right-color:transparent}
 .next{color:var(--meta)} .next .m{border:1.5px solid var(--idle-dot)} .failed{color:var(--bad);font-weight:600} .failed .m{background:var(--bad);color:var(--ground)}
 .now{font-weight:600;padding:7px 0} .l{flex:1} .s{font:12px "JetBrains Mono",ui-monospace,monospace;color:var(--meta)} .now .s{color:var(--amber-ink)} .failed .s{color:var(--bad)}
 .bar{margin-left:26px;height:4px;border-radius:999px;background:var(--line-soft)} .bar i{display:block;width:40%;height:100%;border-radius:999px;background:var(--slate)}
</style>
<div class="head"><strong>staging.dump</strong><span class="clock">3:21</span></div>
<ol>
 <li class="done"><div class="r"><span class="m">✓</span><span class="l">Send the dump</span><span class="s">1.2 GB · 2 min 16 s</span></div></li>
 <li class="now"><div class="r"><span class="m"></span><span class="l">Restore the data</span><span class="s">412 of 1,030 items</span></div><div class="bar"><i></i></div></li>
 <li class="next"><div class="r"><span class="m"></span><span class="l">Count what came in</span></div></li>
 <li class="failed"><div class="r"><span class="m">✗</span><span class="l">Restore the data</span><span class="s">stopped at item 326 of 1,106</span></div></li>
</ol>
<span class="pill work">Restoring</span> <span class="pill ok">Ready to check</span> <span class="pill bad">Failed</span>
