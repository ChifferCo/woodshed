<!-- @dsCard group="Forms" height=300 subtitle="Channel picker: search the workspace's channels, see whether the bot is in each" -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@400;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
 body{margin:0;padding:24px;background:var(--ground);color:var(--ink);font-family:"Red Hat Display",system-ui,sans-serif}
 .wrap{width:460px;display:flex;flex-direction:column;gap:6px}
 .field{border:1px solid #b9b9b9;border-radius:4px;padding:8px 10px;font-size:13px}
 .list{border:1px solid var(--line);border-radius:8px;overflow:hidden}
 .row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:7px 10px;border-top:1px solid var(--line-soft);font-size:13.5px}
 .row:first-child{border-top:0}
 .row.on{background:var(--amber-tint);font-weight:600}
 .pill{font-size:11.5px;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap}
 .ok{background:var(--add-tint);color:var(--green)}.warn{background:var(--amber-tint);color:var(--amber-ink)}.quiet{background:var(--stopped);color:var(--meta);margin-left:8px}
 .sub{font-size:12.5px;color:var(--sub);margin:0}
</style>
<div class="wrap">
 <div class="field">app</div>
 <div class="list">
  <div class="row on"><span>#app-prs</span><span class="pill ok">bot is in it</span></div>
  <div class="row"><span>#app-releases<span class="pill quiet">private</span></span><span class="pill ok">bot is in it</span></div>
  <div class="row"><span>#app-general</span><span class="pill warn">invite the bot first</span></div>
 </div>
 <p class="sub">Chosen: #app-prs (C0APPPRS01)</p>
</div>
